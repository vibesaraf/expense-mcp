worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Match Express body limit (express.json limit: "10mb")
  client_max_body_size 10m;

  # Compose service DNS resolver. Only consulted for upstreams named via a
  # variable (see $web/$api below) — a literal host in proxy_pass is resolved
  # once at startup and cached for the process lifetime, which breaks on
  # redeploy when this container survives and the app containers change IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Common proxy headers, reused by every location.
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;

  server {
    listen 80;
    server_name _;

    # Upstreams go through variables so each request re-resolves via the
    # resolver above. proxy_pass is left URI-less, so nginx still forwards the
    # original request URI unchanged.
    set $api expenses-server;
    set $web expense-web;

    # --- Backend: expenses-server (REST + MCP + OIDC) on :3001 ---

    # REST API — https://mydomain.com/api/* -> server:3001/api/*
    location /api/ {
      proxy_pass http://$api:3001;
    }

    # OIDC callback/logout — client fetches /oidc/* (relative)
    location /oidc/ {
      proxy_pass http://$api:3001;
    }

    # OAuth protected-resource discovery for MCP clients (served at root)
    location /.well-known/ {
      proxy_pass http://$api:3001;
    }

    # Health check passthrough
    location = /health {
      proxy_pass http://$api:3001;
      access_log off;
    }

    # MCP endpoint — https://mydomain.com/mcp/ -> server:3001/mcp/
    # Streamable HTTP transport uses long-lived SSE responses, so disable
    # buffering and extend the read timeout; do not force Connection: close.
    location /mcp {
      proxy_pass http://$api:3001;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding on;
    }

    # --- Frontend: everything else -> expense-web (static nginx) on :80 ---
    location / {
      proxy_pass http://$web:80;
      # expense-web serves the built SPA and handles index.html fallback for
      # client-side routes.
    }
  }
}
